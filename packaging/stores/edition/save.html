<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>VideoSave Commons</title>
<link rel="stylesheet" href="style.css">
<main>
  <header>
    <img src="icons/icon-48.png" alt="" width="48" height="48">
    <h1>VideoSave Commons</h1>
  </header>
  <p id="intro">Save original audio or video files you are permitted to download from Wikimedia Commons.</p>
  <form>
    <label id="url-label" for="url">Original file URL</label>
    <input id="url" type="url" placeholder="https://upload.wikimedia.org/…" required
           autocomplete="off" spellcheck="false" aria-describedby="formats">
    <p id="formats">WebM and Ogg files up to 100 MiB.</p>
    <div class="actions">
      <button id="prepare" type="submit">Load file</button>
      <a id="save" hidden>Save file</a>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="save.mjs"></script>
</html>
