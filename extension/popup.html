<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Media Toolkit</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.mjs"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="mark" aria-hidden="true"><b></b></span>
      <h1>Open Media Toolkit</h1>
    </div>
    <button id="connection-status" class="connection" type="button"><i></i>本机服务</button>
  </header>
  <nav class="navigation" aria-label="面板导航">
    <button type="button" id="videos-toggle" data-panel="videos" aria-current="page">视频 <span id="media-count" hidden></span></button>
    <button type="button" id="downloads-toggle" data-panel="downloads">下载 <span id="active-count" hidden></span></button>
    <button type="button" id="settings-toggle" data-panel="settings">设置</button>
  </nav>
  <main>
    <section id="videos" aria-labelledby="page-title">
      <div class="section-header">
        <div><p class="site" id="site"></p><h2 id="page-title">正在扫描…</h2></div>
        <button id="refresh" class="quiet" type="button"><span class="refresh-icon" aria-hidden="true">↻</span> 扫描</button>
      </div>
      <div class="bulk" id="bulk" hidden>
        <label><input id="all" type="checkbox"> 全选</label>
        <button id="queue-selected" type="button" disabled>下载所选</button>
      </div>
      <p id="hint" class="empty" hidden></p>
      <ul id="media" class="media" aria-label="检测到的视频"></ul>
      <details class="manual">
        <summary>粘贴媒体链接</summary>
        <form id="manual" class="input-row">
          <input id="manual-url" type="url" placeholder="https://…" aria-label="媒体直链" required>
          <button type="submit">下载</button>
        </form>
      </details>
    </section>
    <section id="downloads" hidden aria-labelledby="download-heading">
      <div class="section-header">
        <h2 id="download-heading">下载队列</h2>
        <div class="actions"><button id="clear" class="quiet" type="button" hidden>清空记录</button>
          <button id="folder" class="quiet" type="button">打开目录 ↗</button></div>
      </div>
      <p class="empty" id="queue-empty">暂无下载</p>
      <ul id="queue" class="queue" aria-label="下载任务"></ul>
    </section>
    <section id="settings" hidden aria-label="设置">
      <div class="option-card">
        <h2>下载</h2>
        <div id="settings-options" class="option-grid"></div>
        <label class="folder-field">下载子文件夹
          <input id="download-folder" type="text" maxlength="100" placeholder="Edge 默认下载目录"
                 autocomplete="off" spellcheck="false" aria-label="Edge 下载目录下的子文件夹">
        </label>
        <div class="save-tools">
          <label class="check-row"><input id="save-as" type="checkbox"><span>每次询问保存位置</span></label>
          <button type="button" class="text-button" id="edge-download-settings">更改默认目录 ↗</button>
        </div>
      </div>
      <div class="option-card settings-more">
        <details class="settings-block">
          <summary>传输与文件格式</summary>
          <div id="transfer-options" class="option-grid"></div>
        </details>
        <details class="settings-block">
          <summary>视频列表与预览</summary>
          <div id="detection-options" class="option-grid"></div>
        </details>
        <details class="settings-block" id="appearance-settings">
          <summary>外观</summary>
          <div id="themes" role="group" aria-label="界面主题"></div>
          <div class="accent-row">
            <label for="theme-accent">强调色</label>
            <input type="color" id="theme-accent">
            <button type="button" class="quiet" id="reset-accent" hidden>恢复主题颜色</button>
          </div>
          <div id="interface-options" class="option-grid"></div>
        </details>
        <details class="settings-block" id="service-settings">
          <summary>本机下载服务</summary>
          <form id="pair">
            <label>地址<input id="endpoint" type="url" placeholder="http://127.0.0.1:8765" required></label>
            <label>配对码<input id="token" type="password" autocomplete="off" spellcheck="false" required></label>
            <button type="submit">连接服务</button>
          </form>
        </details>
      </div>
    </section>
  </main>
  <footer>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="history" type="button" class="text-button">Edge 下载记录 ↗</button>
  </footer>
  <dialog id="preview-dialog" aria-labelledby="preview-title">
    <div class="preview-head">
      <h2 id="preview-title"></h2>
      <form method="dialog"><button class="quiet close-preview" aria-label="关闭预览" type="submit">×</button></form>
    </div>
    <video id="preview-video" preload="none" playsinline muted controls></video>
    <p id="preview-status" role="status" hidden></p>
  </dialog>
</body>
</html>
